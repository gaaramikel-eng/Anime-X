  }
  if(!h)return '<p class="em">Nenhum título encontrado.</p>';
  return '<div class="sc"><p class="nt"><b>Hoje ('+DN[t]+'):</b> '+td.length+' títulos com episódio novo'+(S.fol.length?", "+fc+" dos que você segue":"")+'. Toque em um título para abrir.</p><div class="hero">'+td.map(function(x){return '<button class="hc" data-w="'+esc(x)+'">'+cov(x,"Hoje")+'<span>'+esc(x)+'</span></button>'}).join("")+'</div>'+h+'<section class="dy"><h2>Estreias a caminho</h2>'+UP.map(function(u){return '<div class="it" style="cursor:default"><span>'+esc(u[0])+'</span><small>'+u[1]+", "+u[2]+'</small></div>'}).join("")+'</section><p class="nt">Lista da temporada de outono de 2026, conferida em 15/11/2026. Os dias seguem a exibição original e podem variar conforme a plataforma e o fuso horário. Títulos podem entrar em pausa.</p></div>';
}
var TABS=[["ep","Novos episódios"],["new","Recentes"],["anime","Animes"],["manga","Mangás"],["fav","Favoritos"]];
function nav(){$("#nv").innerHTML=TABS.map(function(t){return '<button data-t="'+t[0]+'" class="'+(tab==t[0]?"on":"")+'">'+t[1]+(t[0]=="fav"&&S.fav.length?" ("+S.fav.length+")":"")+'</button>'}).join("")}
function grid(){
  if(tab=="ep"){$("#g").innerHTML=sched();nav();return}
  var L=D.filter(function(d){
    if(tab=="anime"||tab=="manga")if(d.t!=tab)return false;
    if(tab=="fav"&&S.fav.indexOf(d.id)<0)return false;
    var k=(d.n+" "+d.g).toLowerCase();return !q||k.indexOf(q)>=0});
  if(tab=="new")L.sort(function(a,b){return b.y-a.y});
  $("#g").innerHTML=L.length?L.map(function(d){var r=S.rate[d.id];
    return '<button class="c" data-id="'+d.id+'">'+cov(d.n,d.t=="anime"?"Anime":"Mangá",d.h)+''+(S.fav.indexOf(d.id)>=0?'<span class="hrt">♥</span>':'')+'<div class="ct"><strong>'+esc(d.n)+'</strong><small>'+d.y+'</small><small>'+esc(d.g)+'</small><small>'+(r?"Sua nota: "+"★".repeat(r):"Sem nota")+'</small></div></button>'}).join(""):
    '<p class="em">'+(tab=="fav"&&!q?"Nenhum favorito ainda. Abra um título e toque em Favoritar.":"Nenhum título encontrado.")+'</p>';
  nav();
}
function modal(id){
  cur=id;var d=D.filter(function(x){return x.id==id})[0],r=S.rate[id]||0,f=S.fav.indexOf(id)>=0,c=S.cm[id]||[];
  var st="";for(var i=1;i<=5;i++)st+='<button class="st'+(i<=r?" on":"")+'" data-r="'+i+'" aria-label="Nota '+i+'">★</button>';
  $("#m").innerHTML='<div class="sh" role="dialog" aria-label="'+esc(d.n)+'"><button class="x" data-a="close" aria-label="Fechar">✕</button><div class="mh">'+cov(d.n,"",d.h)+'<div><h2>'+esc(d.n)+'</h2><p class="mu">'+(d.t=="anime"?"Anime":"Mangá")+", "+d.y+", "+esc(d.g)+'</p></div></div><p>'+esc(d.s)+'</p>'+(d.t=="anime"?player(d.n):"")+'<div class="row"><span>'+st+'</span><button class="b" data-a="fav">'+(f?"♥ Salvo nos favoritos":"♡ Favoritar")+'</button></div>'+where(d.n,d.t)+'<h3>Comunidade</h3><div class="cf"><input id="ci" maxlength="300" placeholder="Escreva um comentário"><button class="b" data-a="cm">Enviar</button></div>'+
    (c.length?c.map(function(x){return '<div class="cm"><small>'+esc(x.d)+'</small><p>'+esc(x.t)+'</p></div>'}).join(""):'<p class="mu" style="margin-top:12px">Seja o primeiro a comentar. Os comentários ficam salvos só neste aparelho.</p>')+'</div>';
  $("#m").hidden=false;
}
function close(){$("#m").hidden=true;cur=null;curT=null;pl={n:null,e:0,u:null};$("#m").innerHTML=""}
document.addEventListener("click",function(e){
  var b=e.target.closest("[data-id],[data-t],[data-r],[data-a],[data-f],[data-w],[data-e],[data-p]");
  if(!b){if(e.target.id=="m")close();return}
  var a=b.dataset;
  if(a.p){pl={n:a.n,e:+a.p,u:null};S.seen[a.n]=Math.max(S.seen[a.n]||0,+a.p);save();reopen(a.n)}
  else if(a.a=="src"){var si=$("#si"),nn=si.dataset.n,vv=si.value.trim();if(vv)S.src[nn]=vv;else delete S.src[nn];save();reopen(nn)}
  else if(a.id){modal(+a.id)}
  else if(a.w!==undefined){modalT(a.w)}
  else if(a.e){S.seen[curT]=Math.max(0,(S.seen[curT]||0)+(+a.e));save();modalT(curT)}
  else if(a.f!==undefined){var j=S.fol.indexOf(a.f);if(j<0)S.fol.push(a.f);else S.fol.splice(j,1);save();grid();if(curT)modalT(curT)}
  else if(a.t){tab=a.t;grid()}
  else if(a.r){S.rate[cur]=S.rate[cur]==+a.r?0:+a.r;save();modal(cur);grid()}
  else if(a.a=="close")close();
  else if(a.a=="fav"){var i=S.fav.indexOf(cur);if(i<0)S.fav.push(cur);else S.fav.splice(i,1);save();modal(cur);grid()}
  else if(a.a=="cm"){var v=$("#ci").value.trim();if(!v)return;(S.cm[cur]=S.cm[cur]||[]).unshift({t:v,d:"Você, "+new Date().toLocaleDateString("pt-BR")});save();modal(cur)}
});
document.addEventListener("change",function(e){
  if(e.target.id=="lf"&&e.target.files[0]){var n=pl.n||curT||(D.filter(function(x){return x.id==cur})[0]||{}).n;pl={n:n,e:pl.n==n&&pl.e?pl.e:1,u:URL.createObjectURL(e.target.files[0])};reopen(n)}
});
document.addEventListener("keydown",function(e){
  if(e.key=="Escape"&&(cur||curT))close();
  if(e.key=="Enter"&&e.target.id=="ci")document.querySelector('[data-a="cm"]').click();
});
$("#q").addEventListener("input",function(e){q=e.target.value.trim().toLowerCase();grid()});
grid();
</script>
</body>
</html>
